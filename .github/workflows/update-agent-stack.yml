name: Update agent stack

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-agent-stack.yml"
      - "scripts/generate-agent-stack.mjs"

permissions:
  contents: write

concurrency:
  group: update-agent-stack
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate the dashboard from GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: talibilat
        run: node scripts/generate-agent-stack.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- assets/agent-stack.svg assets/agent-stack.json; then
            echo "Agent stack data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/agent-stack.svg assets/agent-stack.json
          git commit -m "Update agent stack data"
          git push
