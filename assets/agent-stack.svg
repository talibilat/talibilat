<svg xmlns="http://www.w3.org/2000/svg" width="844" height="505" viewBox="0 0 844 505" role="img" aria-labelledby="title description">
  <title id="title">The agent stack</title>
  <desc id="description">Live GitHub data for Vox, Zentra, Agent Trail, Limit Bar, languages, repositories, followers, pull requests, and achievements.</desc>
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .heading { fill: #f0f6fc; font-size: 22px; font-weight: 700; }
      .eyebrow { fill: #7d8590; font-size: 13px; letter-spacing: .35px; }
      .name { fill: #f0f6fc; font-size: 16px; font-weight: 700; }
      .repo { fill: #7d8590; font-size: 10.5px; }
      .body { fill: #9da7b3; font-size: 12.5px; }
      .meta { fill: #9da7b3; font-size: 11.5px; text-transform: capitalize; }
      .progress { fill: #7d8590; font-size: 9.5px; }
      .active { fill: #3fb950; font-size: 11.5px; }
      .quiet { fill: #d29922; font-size: 11.5px; }
      .metric { fill: #f0f6fc; font-size: 25px; font-weight: 700; }
      .metric-hot { fill: #f7812f; font-size: 25px; font-weight: 700; }
      .label { fill: #9da7b3; font-size: 11.5px; }
      .sub-label { fill: #7d8590; font-size: 9px; }
      .card { fill: #0d1117; stroke: #30363d; }
      .spark { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <clipPath id="language-bar"><rect x="50" y="431" width="333" height="11" rx="5.5" /></clipPath>
  </defs>
  <rect width="844" height="505" fill="#0d1117" />
  <g class="ui">
    <text class="heading" x="24" y="28">The agent stack</text>
    <text class="eyebrow mono" x="201" y="27">7-day GitHub activity</text>
    <rect class="card" x="25" y="45" width="384" height="155" rx="10" />
    <text class="name" x="46" y="79">vox</text>
    <text class="repo mono" x="46" y="98">talibilat/vox</text>
    <path class="spark" stroke="#58a6ff" d="M238.0 92.0 L263.0 92.0 L288.0 92.0 L313.0 92.0 L338.0 92.0 L363.0 92.0 L388.0 70.0" />
    <text class="body" x="46" y="124">Earshot: voice-to-voice control for terminal coding</text>
    <text class="body" x="46" y="143">agents (opencode, Claude Code, codex). Wake word, spoken…</text>
    <circle cx="50" cy="164" r="4.5" fill="#4493c8" />
    <text class="meta" x="60" y="168">Python</text>
    <text class="meta" x="137" y="168">public</text>
    <text class="active" x="186" y="168">▲ active</text>
    <text class="progress mono" x="46" y="189">0 pushes / 7d  ·  2 other  ·  1 open  ·  pushed today</text>
    <rect class="card" x="423" y="45" width="384" height="155" rx="10" />
    <text class="name" x="444" y="79">zentra</text>
    <text class="repo mono" x="444" y="98">talibilat/zentra</text>
    <path class="spark" stroke="#a371f7" d="M636.0 92.0 L661.0 92.0 L686.0 86.3 L711.0 81.8 L736.0 70.0 L761.0 86.1 L786.0 76.9" />
    <text class="body" x="444" y="124">The hands. Orchestration kernel for durable events and</text>
    <text class="body" x="444" y="143">safe integration.</text>
    <circle cx="448" cy="164" r="4.5" fill="#4493c8" />
    <text class="meta" x="458" y="168">TypeScript</text>
    <text class="meta" x="535" y="168">public</text>
    <text class="active" x="584" y="168">▲ active</text>
    <text class="progress mono" x="444" y="189">71+ pushes / 7d  ·  229+ other  ·  15 open  ·  pushed today</text>
    <rect class="card" x="25" y="212" width="384" height="155" rx="10" />
    <text class="name" x="46" y="246">agent-trail</text>
    <text class="repo mono" x="46" y="265">talibilat/agent-trail</text>
    <path class="spark" stroke="#f7812f" d="M238.0 259.0 L263.0 259.0 L288.0 259.0 L313.0 259.0 L338.0 237.0 L363.0 258.8 L388.0 257.9" />
    <text class="body" x="46" y="291">The window. Visual observability for commands moving</text>
    <text class="body" x="46" y="310">through Zentra.</text>
    <circle cx="50" cy="331" r="4.5" fill="#4493c8" />
    <text class="meta" x="60" y="335">Python</text>
    <text class="meta" x="137" y="335">public</text>
    <text class="active" x="186" y="335">▲ active</text>
    <text class="progress mono" x="46" y="356">13 pushes / 7d  ·  93 other  ·  0 open  ·  pushed today</text>
    <rect class="card" x="423" y="212" width="384" height="155" rx="10" />
    <text class="name" x="444" y="246">limit-bar</text>
    <text class="repo mono" x="444" y="265">talibilat/limit-bar</text>
    <path class="spark" stroke="#3fb950" d="M636.0 250.1 L661.0 249.3 L686.0 259.0 L711.0 256.4 L736.0 239.2 L761.0 237.0 L786.0 255.6" />
    <text class="body" x="444" y="291">A free macOS menu bar app for AI coding usage and rate</text>
    <text class="body" x="444" y="310">limits.</text>
    <circle cx="448" cy="331" r="4.5" fill="#4493c8" />
    <text class="meta" x="458" y="335">Swift</text>
    <text class="meta" x="535" y="335">public</text>
    <text class="active" x="584" y="335">▲ active</text>
    <text class="progress mono" x="444" y="356">41 pushes / 7d  ·  160 other  ·  2 open  ·  pushed today</text>
    <rect class="card" x="25" y="379" width="384" height="106" rx="10" />
    <text class="name" x="50" y="414">Languages</text>
    <g clip-path="url(#language-bar)">
      <rect x="50.0" y="431" width="285.8" height="11" fill="#da5b0b" />
      <rect x="335.8" y="431" width="19.8" height="11" fill="#4493c8" />
      <rect x="355.6" y="431" width="14.4" height="11" fill="#3178c6" />
      <rect x="370.0" y="431" width="13.0" height="11" fill="#6e7681" />
    </g>
    <text class="label" x="50" y="465">Jupyter 86%</text>
    <text class="label" x="158" y="465">Python 6%</text>
    <text class="label" x="242" y="465">TypeScript 4%</text>
    <text class="label" x="333" y="465">Other 4%</text>
    <rect class="card" x="423" y="379" width="384" height="106" rx="10" />
    <text class="metric-hot" x="449" y="433">42</text>
    <text class="label" x="449" y="453">public repos</text>
    <text class="metric" x="545" y="433">6</text>
    <text class="label" x="545" y="453">followers</text>
    <text class="metric" x="624" y="433">x3</text>
    <text class="label" x="624" y="453">pull shark</text>
    <text class="sub-label" x="624" y="469">299 merged PRs</text>
    <text class="metric" x="699" y="433">3</text>
    <text class="label" x="699" y="453">achievements</text>
  </g>
</svg>
